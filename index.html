<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Consumption</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="top-nav">
        <img src="/images/Crafty Dev.png" alt="">
        <h3>Country Fetch API Web Page</h3>
        <P>Made Possible by Entering a <b>Country Name</b> to know more about them.</P> 
    </div>

    
    <div class="input-form">
        <input id="country-input" placeholder="...input country name..." type="text">
        <button id="btn">Search</button>
    </div>

    <main>
        <div class="about-div">
            <h5>About Country</h5>
            <h1 id="country-name"></h1>
            <h4 id="official"></h4>
    
            <div id="more-about">
                <h1 id="continent"><b id="region"></b></h1>
                <h4 id="currency"></h4>
            </div>
        </div>

        

        <div>
            <h5>Country Flag</h5>
            <img id="flag-img" src="/images/img placeholder.jpg" alt="flag">
        </div>


        <div>
            <h5>Coat Of Arms</h5>
            <img id="coa-img" src="/images/img placeholder.jpg" alt="coat of arms">
        </div>

        <div class="map-div">
            <img src="/images/map.jpg" alt="map">
            <h3>Want To View Map...?</h3>
            <a id="map" href="">⬇ Click Here ⬇</a>

        </div>
    </main>


</body>
<script src="/index.js"></script>
</html>
